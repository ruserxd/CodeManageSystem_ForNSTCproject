services:
  # 反向代理
  nginx:
    image: nginx:alpine
    # 避免校內用明文 HTTP 繞過 HTTPS 與 Access，入口只剩 Cloudflare Tunnel(經 compose 內網);宿主機的 80 只供本機煙霧測試
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # Tunnel 與 HTTPS 的入口
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    depends_on:
      - nginx
    profiles:
      - tunnel
    env_file:
      - ./cloudflared.env

  # 前端: React
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    image: ghcr.io/ruserxd/codemanager_frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped

  # 後端: Spring-Boot
  backend:
    depends_on:
      db:
        condition: service_healthy
    build: ./backend
    image: ghcr.io/ruserxd/codemanager_backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=${DOCKER_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${DOCKER_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DOCKER_DATASOURCE_PASSWORD}
      - SPRING_PROFILES_ACTIVE=production
      - SERVER_PORT=8080
      - "JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: "4.0"
    memswap_limit: 16g
    volumes:
      - backend_clonecode:/app/src/cloneCode
      - backend_log:/app/src/log
    restart: unless-stopped

  # 資料庫: MySQL
  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=myjdbc
      - MYSQL_ROOT_PASSWORD=${DOCKER_DATASOURCE_PASSWORD}
      - MYSQL_ROOT_HOST=%
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DOCKER_DATASOURCE_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s

volumes:
  mysql_data:
  backend_clonecode:
  backend_log:
