events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;
    limit_req_zone $binary_remote_addr$uri zone=auth_limit:10m rate=15r/m;
    limit_req_status 429;
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $forwarded_proto $forwarded_port {
        default 80;
        https  443;
    }

    # TODO: 確認 https 路徑沒問題,沒有子網域被誤傷,再改成 31536000
    map $forwarded_proto $hsts_value {
        default "";
        https   "max-age=500; includeSubDomains";
    }

    server {
        listen 80;
        server_name _;
        server_tokens off;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_value always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port  $forwarded_port;
        proxy_set_header X-Forwarded-Host  $host;

        # 前端
        location / {
            proxy_pass http://frontend:80;
        }

        # 後端
        location /api/ {
            proxy_pass http://backend:8080;

            # 這兩個 header 由上面 server 層的 add_header 統一送出,隱藏後端的避免重複
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
        }

        # 登入相關 API 限速：每個 IP 每個 API 15 次/分，瞬間最多 6 次
        # 取捨：限速 key 為 IP + 端點, 三個端點各自計算,單一 IP 合計約 45 次/分。
        location ~ ^/api/(login|register|demo-login)/?$ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend:8080;

            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Strict-Transport-Security;
        }
    }
}
