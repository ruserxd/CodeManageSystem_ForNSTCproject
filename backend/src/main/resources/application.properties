# Spring boot
# 可用環境變數 SERVER_PORT 覆蓋，未設定時預設 8080
server.port=${SERVER_PORT:8080}
# 信任 nginx 轉發的 X-Forwarded-*，讓 Spring 還原外部的 https／網域（否則 Cloudflare HTTPS 的 Origin 會被當成跨來源而回 403）
# 前提：只有 nginx 連得到 backend（compose 中 backend 沒有對外 port），否則外部可偽造 X-Forwarded-*
server.forward-headers-strategy=framework
spring.application.name=CodeMangeSystem
# JPA DB Configuration
spring.datasource.url=${spring.datasource.url}
spring.datasource.username=${spring.datasource.username}
spring.datasource.password=${spring.datasource.password}
# JPA setting
# schema 由 Flyway（src/main/resources/db/migration）管理；Hibernate 只驗證 entity 與 schema 是否一致
spring.jpa.hibernate.ddl-auto=validate
# Flyway：已由舊版 ddl-auto=update 建好表、但沒有 flyway_schema_history 的資料庫，直接標記在 V1
# 注意：要重建資料庫時請刪掉整個 database（或連 flyway_schema_history 一起刪），只刪業務表的話 Flyway 會以為已在 V1 而不再建表
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Spring Boot Actuator
management.endpoints.web.exposure.include=beans,mappings
# Sl4fj setting
# info to root
# Root logging level (adjust as needed)
logging.level.root=INFO
# Base log file name and location
logging.file.name=src/log/logfile.log
# JWT setting (HS256 的密鑰至少需要 32 bytes，請透過環境變數 JWT_SECRET 設定)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=8

# 全站每日額度（以 Asia/Taipei 的日期為界）：註冊人數、clone／分析次數
app.quota.daily-registrations=${APP_QUOTA_DAILY_REGISTRATIONS:5}
app.quota.daily-analyses=${APP_QUOTA_DAILY_ANALYSES:10}

# 單次分析上限：commit 數依角色區分（只分析最新 N 個）、每人專案數（ADMIN 不受限）、clone 前最低可用磁碟空間
app.limits.user-max-commits=${APP_LIMITS_USER_MAX_COMMITS:500}
app.limits.admin-max-commits=${APP_LIMITS_ADMIN_MAX_COMMITS:70000}
app.limits.max-projects-per-user=${APP_LIMITS_MAX_PROJECTS_PER_USER:3}
app.limits.min-free-disk-mb=${APP_LIMITS_MIN_FREE_DISK_MB:2048}
