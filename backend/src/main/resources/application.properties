# Spring boot
# 可用環境變數 SERVER_PORT 覆蓋，未設定時預設 8080
server.port=${SERVER_PORT:8080}
spring.application.name=CodeMangeSystem
# JPA DB Configuration
spring.datasource.url=${spring.datasource.url}
spring.datasource.username=${spring.datasource.username}
spring.datasource.password=${spring.datasource.password}
# JPA setting
# schema 由 Flyway（src/main/resources/db/migration）管理；Hibernate 只驗證 entity 與 schema 是否一致
spring.jpa.hibernate.ddl-auto=validate
# Flyway：已由舊版 ddl-auto=update 建好表、但沒有 flyway_schema_history 的資料庫，直接標記在 V1
# 注意：要重建資料庫時請刪掉整個 database（或連 flyway_schema_history 一起刪），只刪業務表的話 Flyway 會以為已在 V1 而不再建表
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Spring Boot Actuator
management.endpoints.web.exposure.include=beans,mappings
# Sl4fj setting
# info to root
# Root logging level (adjust as needed)
logging.level.root=INFO
# Base log file name and location
logging.file.name=src/log/logfile.log
# JWT setting (HS256 的密鑰至少需要 32 bytes，請透過環境變數 JWT_SECRET 設定)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=8
